name: Build Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Build Tools & Platform
      run: |
        yes | sdkmanager --licenses
        sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.5'

    - name: Install Cordova
      run: npm install -g cordova

    - name: Add Android Platform
      run: cordova platform add android@12.0.1

    # cordova-plugin-admob-free is unmaintained and still imports the legacy
    # android.support.annotation.NonNull, which no longer exists under AndroidX
    # (cordova-android@12 default). This patches the single import to
    # androidx.annotation.NonNull, already available via androidx.appcompat.
    # No plugin logic, IDs, or app behavior changes — annotation import only.
    - name: Patch AdMob plugin for AndroidX compatibility
      run: |
        sed -i 's/import android\.support\.annotation\.NonNull;/import androidx.annotation.NonNull;/' \
          platforms/android/app/src/main/java/name/ratson/cordova/admob/AdMob.java

    - name: Build Android Release APK
      env:
        GRADLE_OPTS: "-Xmx2048m"
      run: cordova build android --release -- --packageType=apk

    - name: Upload Release APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Snake-Glow-Release-APK
        path: platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk
