name: Build Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Build Tools & Platform
      run: |
        yes | sdkmanager --licenses
        sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

    - name: Install Cordova
      run: npm install -g cordova

    - name: Add Android Platform
      run: cordova platform add android@12.0.1

    # NOTE: No separate "cordova plugin add" step needed —
    # cordova-plugin-admob-free (with ADMOB_APP_ID) is already
    # declared in config.xml and gets installed automatically
    # when the Android platform is added.

    - name: Build Android Release APK
      run: cordova build android --release -- --gradleArg=-Xmx2048m

    - name: Upload Release APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Snake-Glow-Release-APK
        path: platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk
