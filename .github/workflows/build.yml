name: Build Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Build Tools & Platform
      run: |
        yes | sdkmanager --licenses
        sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

    # Pin a Gradle version compatible with cordova-android@12.0.1's
    # own build scripts (CordovaLib/cordova.gradle uses groovy.util.XmlParser,
    # which breaks under Gradle 9's bundled Groovy). Without this, the runner's
    # default system Gradle (9.x) gets used to bootstrap Cordova's wrapper and fails.
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.5'

    - name: Install Cordova
      run: npm install -g cordova

    - name: Add Android Platform
      run: cordova platform add android@12.0.1

    # cordova-plugin-admob-free + ADMOB_APP_ID are already declared in
    # config.xml and get installed automatically here — no separate
    # "cordova plugin add" step needed.

    - name: Build Android Release APK
      run: cordova build android --release -- --gradleArg=-Xmx2048m

    - name: Upload Release APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Snake-Glow-Release-APK
        path: platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk
