name: Build APK (Debug + Signed Release)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Build Tools & Platform
      run: |
        yes | sdkmanager --licenses
        sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.5'

    - name: Install Cordova
      run: npm install -g cordova

    - name: Add Android Platform
      run: cordova platform add android@12.0.1

    # cordova-plugin-admob-free is unmaintained and still imports the legacy
    # android.support.annotation.NonNull, which no longer exists under AndroidX
    # (cordova-android@12 default). This patches the single import to
    # androidx.annotation.NonNull, already available via androidx.appcompat.
    # No plugin logic, IDs, or app behavior changes — annotation import only.
    - name: Patch AdMob plugin for AndroidX compatibility
      run: |
        sed -i 's/import android\.support\.annotation\.NonNull;/import androidx.annotation.NonNull;/' \
          platforms/android/app/src/main/java/name/ratson/cordova/admob/AdMob.java

    # ---------- PATH 1: DEBUG APK (auto-signed, installs immediately) ----------
    - name: Build Android Debug APK
      env:
        GRADLE_OPTS: "-Xmx2048m"
      run: cordova build android --debug -- --packageType=apk

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Snake-Glow-Debug-APK
        path: platforms/android/app/build/outputs/apk/debug/app-debug.apk

    # ---------- PATH 2: SIGNED RELEASE APK (needs 3 secrets, see notes) ----------
    - name: Check if release signing secrets are configured
      id: check_secrets
      run: |
        if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ] && [ -n "${{ secrets.KEYSTORE_PASSWORD }}" ] && [ -n "${{ secrets.KEY_PASSWORD }}" ]; then
          echo "ready=true" >> "$GITHUB_OUTPUT"
        else
          echo "ready=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Build Android Release APK
      if: steps.check_secrets.outputs.ready == 'true'
      env:
        GRADLE_OPTS: "-Xmx2048m"
      run: cordova build android --release -- --packageType=apk

    - name: Decode Keystore
      if: steps.check_secrets.outputs.ready == 'true'
      run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release-key.keystore

    - name: Sign & Align Release APK
      if: steps.check_secrets.outputs.ready == 'true'
      run: |
        BUILD_TOOLS=$ANDROID_HOME/build-tools/33.0.2
        $BUILD_TOOLS/zipalign -v -p 4 \
          platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk \
          app-release-aligned.apk
        $BUILD_TOOLS/apksigner sign \
          --ks release-key.keystore \
          --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
          --key-pass pass:${{ secrets.KEY_PASSWORD }} \
          --out app-release-signed.apk \
          app-release-aligned.apk

    - name: Upload Signed Release APK
      if: steps.check_secrets.outputs.ready == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: Snake-Glow-Release-APK-Signed
        path: app-release-signed.apk

    - name: Skip release signing (secrets not set)
      if: steps.check_secrets.outputs.ready == 'false'
      run: echo "Skipping signed release build — add KEYSTORE_BASE64, KEYSTORE_PASSWORD, and KEY_PASSWORD secrets to enable it."
