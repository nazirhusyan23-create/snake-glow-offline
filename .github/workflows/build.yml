name: Build Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Setup Java JDK
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '11'

    - name: Install Cordova
      run: npm install -g cordova

    - name: Add Android Platform & Plugins
      run: |
        cordova platform add android@10.1.2
        cordova plugin add cordova-plugin-admob-free

    - name: Build Android Release APK
      run: cordova build android --release -- --extra-gradle-args="-Xmx2048m"

    - name: Upload Release APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: Snake-Glow-Release-APK
        path: platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk
