name: Build APK (Debug + Signed Release)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Build Tools & Platform
      run: |
        yes | sdkmanager --licenses
        sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.5'

    - name: Install Cordova
      run: npm install -g cordova

    - name: Add Android Platform
      run: cordova platform add android@12.0.1

    - name: Patch AdMob plugin for AndroidX compatibility
      run: |
        sed -i 's/import android\.support\.annotation\.NonNull;/import androidx.annotation.NonNull;/' \
          platforms/android/app/src/main/java/name/ratson/cordova/admob/AdMob.java

    # ---------- DEBUG APK ----------
    - name: Build Android Debug APK
      env:
        GRADLE_OPTS: "-Xmx2048m"
      run: cordova build android --debug -- --packageType=apk

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Snake-Glow-Debug-APK
        path: platforms/android/app/build/outputs/apk/debug/app-debug.apk

    # ---------- ON-THE-FLY KEYSTORE & RELEASE APK ----------
    - name: Build Android Release APK
      env:
        GRADLE_OPTS: "-Xmx2048m"
      run: cordova build android --release -- --packageType=apk

    - name: Generate Release Keystore On-The-Fly
      run: |
        keytool -genkey -v -keystore my-release-key.keystore -alias my-key-alias -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Nazir, OU=SnakeGlow, O=Dev, L=Rawalpindi, S=Punjab, C=PK" -storepass password123 -keypass password123

    - name: Sign & Align Release APK
      run: |
        BUILD_TOOLS=$ANDROID_HOME/build-tools/33.0.2
        $BUILD_TOOLS/zipalign -v -p 4 \
          platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk \
          app-release-aligned.apk
        $BUILD_TOOLS/apksigner sign \
          --ks my-release-key.keystore \
          --ks-pass pass:password123 \
          --key-pass pass:password123 \
          --out app-release-signed.apk \
          app-release-aligned.apk

    - name: Upload Signed Release APK & Keystore
      uses: actions/upload-artifact@v4
      with:
        name: Snake-Glow-Release-APK-Signed
        path: |
          app-release-signed.apk
          my-release-key.keystore
